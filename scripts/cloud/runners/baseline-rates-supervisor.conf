; Baseline rate fill. Append to the box's supervisord config, then `supervisorctl reread && update`.
; Start the gate program once, then the lane programs; none autostart, so a reboot never launches GPU work.
[program:sfs-ratefill-gates]
command=/bin/bash /workspace/sfs/setup/ratefill-gates.sh
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/sfs/ratefill/gates.log
redirect_stderr=true

[program:sfs-ratefill-a]
command=/bin/bash /workspace/sfs/setup/baseline-rates-lane-a.sh
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/sfs/ratefill/lane-a.log
redirect_stderr=true

[program:sfs-ratefill-b]
command=/bin/bash /workspace/sfs/setup/baseline-rates-lane-b.sh
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/sfs/ratefill/lane-b.log
redirect_stderr=true

; Four-GPU rental: start this one instead of the two lane programs.
[program:sfs-ratefill-single]
command=/bin/bash /workspace/sfs/setup/baseline-rates-single.sh
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/sfs/ratefill/single.log
redirect_stderr=true
