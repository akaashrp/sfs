; Interruptible rental: the single-lane runner and the off-box mirror come back by themselves after
; the instance restarts. Both are safe to start unattended -- the runner exits immediately unless
; /workspace/sfs/bootstrap-complete exists, and it skips every cell that already has a receipt.
; Use this INSTEAD of the lane programs in baseline-rates-supervisor.conf.
[program:sfs-ratefill-sync]
command=/bin/bash /workspace/sfs/setup/sync-ratefill.sh
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/sfs/ratefill/sync.log
redirect_stderr=true

[program:sfs-ratefill-single]
command=/bin/bash /workspace/sfs/setup/baseline-rates-single.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/sfs/ratefill/single.log
redirect_stderr=true
